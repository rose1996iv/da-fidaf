site_name: DA-FIDAF Research Documentation
site_description: >-
  Drift-Aware Federated Intrusion Detection and Attribution Framework for
  heterogeneous IoT/IIoT networks under Non-IID data, concept drift, and
  adversarial threats.
docs_dir: docs
site_dir: site
exclude_docs: |
  repository/proposed_staged_updates/
strict: false

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  research_status: "Active PhD Research — Experimental Validation and Development"
  phase_3b2_verdict: "Conditional Pass"
  methodology_alignment_verdict: "Insufficient Source Evidence"
  privacy_mode: "Non-DP Experimental Baseline Only"
  license_status: "Pending Researcher / Institutional Confirmation"

